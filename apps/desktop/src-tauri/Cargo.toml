[package]
name = "klanker_desktop"
version = "0.0.1"
description = "Klanker — Adaptive Agent Workbench"
authors = ["Lolaplex"]
edition = "2021"
# `File::try_lock` (secrets vault lock) stabilized in 1.89 — pin so a
# stable-older toolchain fails at resolution time, not mid-build.
rust-version = "1.89"

[lib]
name = "klanker_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Debug exe = Klanker.exe too (matches mainBinaryName) — Windows firewall
# prompts show the file name when no version info exists.
[[bin]]
name = "Klanker"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-mcp-bridge = "0.13"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5.0"
uuid = { version = "1.10", features = ["v4", "fast-rng"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
