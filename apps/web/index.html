<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/klanker.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      // Anti-flash theme bootstrap (klanker#170 U16): apply the persisted
      // preference before css paints. theme.ts re-applies authoritatively.
      try {
        var p = localStorage.getItem("klanker.theme") || "dark";
        var m = p === "system" ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") : p;
        document.documentElement.dataset.theme = m;
        document.documentElement.classList.add(m);
      } catch (e) { document.documentElement.dataset.theme = "dark"; document.documentElement.classList.add("dark"); }
    </script>
    <title>Klanker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
