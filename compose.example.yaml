# Example compose for the klanker image (no build context).
# Copy to compose.yml and fill the <placeholders>; keep secrets in .env.
#
# Port contract: the container listens on 8000 (RELAY_PORT in the image);
# map the host port your clients probe (klanker-desktop checks 8787 first).
services:
  klanker:
    image: <registry>/klanker:latest
    pull_policy: always
    restart: unless-stopped
    # entrypoint.sh owns privilege drop: start as root so it can chown the
    # bind-mounted /data, then setpriv down to the klanker user.
    user: "0"
    ports:
      - "8787:8000"
    env_file:
      - .env
    environment:
      - TZ=<timezone>          # e.g. Europe/Berlin
      # Host layout only. No AGENTS_*_DIR overrides: every workspace owns
      # its memory/traces/schedules under <host>/workspaces/<id>/.
      - AGENTS_HOST_DIR=/data/.agents
      # Optional: fold a legacy host-level layout into a workspace on boot.
      # - AGENTS_AUTO_MIGRATE=1
      # Dashboard (static, served by the relay — no node at runtime):
      # RELAY_WEB_TOKEN enables the web surface (static files + cookie login).
      # The image ships the built dashboard at /app/web/dist; unset to run API-only.
      - RELAY_WEB_TOKEN=<web-login-token>
      - AGENTS_RELAY_WEB_DIR=/app/web/dist
      # RELAY_SECRET is the bearer for non-cookie API clients.
      # - RELAY_SECRET=<api-secret>
      # GitHub access for coding jobs/turns: fine-grained PAT, forwarded into
      # ws containers via env passthrough (never written to ws files).
      # - GH_TOKEN=<fine-grained-pat>
    volumes:
      - <host-data-dir>:/data
      # Workspace isolation=container: turns run inside a per-workspace
      # sibling container. Prefer the socket proxy (below) over mounting
      # docker.sock directly — the raw socket equals host root.
      # - docker-socket:/var/run/docker.sock
    # environment for isolation:
    #   - AGENTS_WS_ISOLATION=container
    #   - DOCKER_HOST=tcp://docker-socket:2375   (when using the proxy)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Allowlisted docker API for workspace containers. Blocks bind-mount and
  # privileged escalation; klanker points DOCKER_HOST here.
  # docker-socket:
  #   image: tecnativa/docker-socket-proxy:latest
  #   restart: unless-stopped
  #   environment:
  #     - CONTAINERS=1
  #     - EXEC=1
  #     - IMAGES=1
  #     - POST=1
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  docker-socket:
