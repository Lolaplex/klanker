# Commit discipline — the server-side wall. Local hooks/ install the same gate
# via `hooks/install.sh`, but hooks are bypassable (--no-verify, or simply
# never installed). This workflow re-runs the exact same grammar (the donor's
# commit-msg.cjs, not a re-implementation) over every commit a PR adds, so the
# discipline is enforced where it cannot be skipped.
name: commit-discipline
on:
  pull_request:
    branches: [dev, main]

jobs:
  messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate every commit message in the PR range
        shell: bash
        run: |
          set -euo pipefail
          BASE_REF="origin/${GITHUB_BASE_REF}"
          if ! git rev-parse --verify -q "$BASE_REF" >/dev/null 2>&1; then
            git fetch origin "$GITHUB_BASE_REF"
          fi
          RANGE_ARG="${BASE_REF}..HEAD"
          FAILED=0
          for sha in $(git rev-list "$RANGE_ARG"); do
            MSG="$(mktemp)"
            git log --format=%B -1 "$sha" > "$MSG"
            FIRST="$(head -1 "$MSG")"
            # merge commits author no belief — same exemption as the hook
            case "$FIRST" in Merge*) continue ;; esac
            if ! HOOK_DIFF_RANGE="${BASE_REF}..${sha}" node hooks/commit-msg.cjs "$MSG"; then
              echo "::error::commit $sha fails the discipline — $(echo "$FIRST" | cut -c1-72)"
              FAILED=1
            fi
          done
          [ "$FAILED" -eq 0 ] || { echo "Commit discipline gate FAILED"; exit 1; }
          echo "All commits in $RANGE_ARG pass the discipline"
