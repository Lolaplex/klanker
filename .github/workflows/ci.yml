name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check (Ubuntu, Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUITE_REF: ${{ vars.SUITE_REF || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install build twine pytest httpx
          # Suite packages from git, so a PR can test against unreleased suite versions.
          for pkg in agents-traces agents-memory agents-calendar agents-relay; do
            pip install "$pkg @ git+https://github.com/Lolaplex/$pkg.git@$SUITE_REF"
          done
          pip install "agents-harness[mcp] @ git+https://github.com/Lolaplex/agents-harness.git@$SUITE_REF"
          pip install -e .

      - name: Test
        run: |
          python -m pytest -q --tb=short

      - name: Build
        run: |
          python -m build
          twine check dist/*
