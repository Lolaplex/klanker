name: CI

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Ubuntu - Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools & dependencies
        env:
          READ_REPO_TOKEN: ${{ secrets.READ_REPO_TOKEN }}
        run: |
          python -m pip install --upgrade pip
          pip install build twine pytest httpx
          # Stacked-suite pins: this branch ships against unreleased legs of
          # its sibling repos. dev-suite.py honours <NAME>_REF first; the
          # head-ref guard makes the pins self-expire once merged to dev.
          # The BASE_REF arm covers PRs stacked on top of feat/ws-share-acl
          # (e.g. fix/windows-test-robustness) — their own head ref never
          # exists in the siblings, so without it they resolve to dev.
          if [ "${GITHUB_HEAD_REF:-}" = "feat/ws-share-acl" ] || \
             [ "${GITHUB_BASE_REF:-}" = "feat/ws-share-acl" ]; then
            export AGENTS_STORE_REF=feat/store-migration-scrub-hlc
            export AGENTS_WORKSPACE_REF=feat/failclosed-policy-identity-secrets
            export AGENTS_RELAY_REF=feat/store-projection-readers
            export AGENTS_HARNESS_REF=feat/store-projection-readers
            export AGENTS_TRACES_REF=feat/store-projection-readers
            export AGENTS_SYNC_REF=feat/opdist-seen-starvation-peerbook
          fi
          if [ "${GITHUB_BASE_REF:-}" != "main" ] && [ "${GITHUB_REF_NAME:-}" != "main" ]; then
            python scripts/dev-suite.py
            pip install -e . || pip install --no-deps -e .
          else
            pip install -e .
          fi

      - name: Run test suite
        timeout-minutes: 12
        run: |
          pytest

      - name: Post error to CI webhook
        if: failure()
        env:
          CI_WEBHOOK_URL: ${{ secrets.CI_WEBHOOK_URL }}
        run: |
          if [ -z "$CI_WEBHOOK_URL" ]; then
            echo "::warning::CI_WEBHOOK_URL unset; skip notification"
            exit 0
          fi
          PAYLOAD=$(python3 -c "import json, os; repo=os.environ['GITHUB_REPOSITORY']; server=os.environ['GITHUB_SERVER_URL']; repo_url=f'{server}/{repo}'; ref=os.environ.get('GITHUB_HEAD_REF') or os.environ.get('GITHUB_REF_NAME'); run_url=f'{server}/{repo}/actions/runs/{os.environ[\"GITHUB_RUN_ID\"]}'; print(json.dumps({'embeds':[{'title':f'🔴 CI Failure: {repo}','url':run_url,'description':f\"Workflow **{os.environ['GITHUB_WORKFLOW']}** failed on \`{ref}\`\\n[View run]({run_url}) · [Repository]({repo_url})\",'color':15158332}]}))")
          curl -fsS -X POST -H 'Content-Type: application/json' -d "$PAYLOAD" "$CI_WEBHOOK_URL"

  web:
    name: Web (typecheck + unit tests + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install
        run: pnpm --dir apps/web install --frozen-lockfile

      - name: Typecheck
        run: pnpm --dir apps/web run typecheck

      - name: Unit tests
        run: pnpm --dir apps/web test

      - name: Build
        run: pnpm --dir apps/web run build

  rust:
    name: Rust (desktop src-tauri tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libdbus-1-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Cargo test
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
