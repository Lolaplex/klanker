# Image-only compose for Synology Container Manager (no build context).
# Image lives in the NAS registry at /volume1/docker/registry (port 9500).
# Publish from the Windows build machine, then create/recreate this project.
#
# On the NAS this file is named compose.yml (scripts/nas-sync.ps1 copies it).
#
#   pwsh scripts/nas-deploy.ps1
#
# CM registry: sigmanas.local:9500
# NAS dockerd insecure: 127.0.0.1:9500 (sigmanas.local -> 127.0.0.1)
# Build machine cannot reach :9500 on the LAN (registry binds 127.0.0.1).
# publish-registry.ps1 docker-saves, scps, loads, and pushes on the NAS.
# Secrets stay in /volume1/docker/klanker/.env (never in the image).
# No Watchtower here. After a registry push, /volume1/docker/pull-latest.sh
# pulls and recreates only if the image digest moved (also a 5 min host cron).
#
# Port contract: container listens on 8000 (GATEWAY_PORT in the image);
# the host maps 8787, the port klanker-desktop discovery probes first.
services:
  klanker:
    image: sigmanas.local:9500/klanker:latest
    pull_policy: always
    restart: unless-stopped
    # entrypoint.sh owns privilege drop: start as root so it can chown the
    # bind-mounted /data, then setpriv down to the klanker user.
    user: "0"
    ports:
      - "8787:8000"
    env_file:
      - .env
    environment:
      - TZ=Europe/Berlin
      - AGENTS_MEMORY_PATH=/data/.agents/memory
      - AGENTS_TRACES_DIR=/data/.agents/traces
    volumes:
      - /volume1/docker/klanker/data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
