[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "klanker"
version = "0.0.1"
description = "Universal, adaptive slimemold AI agent shell on the Lolaplex suite"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lolaplex" }]
requires-python = ">=3.10"
dependencies = [
    "agents-harness @ git+https://github.com/Lolaplex/agents-harness.git@main",
    "agents-relay @ git+https://github.com/Lolaplex/agents-relay.git@dev",
    "agents-memory @ git+https://github.com/Lolaplex/agents-memory.git@dev",
    "agents-traces @ git+https://github.com/Lolaplex/agents-traces.git@main",
    "agents-docs @ git+https://github.com/Lolaplex/agents-docs.git@dev",
]

[project.optional-dependencies]
browser = [
    "agents-browser @ git+https://github.com/Lolaplex/agents-browser.git@main",
]
keys = [
    "agents-keys @ git+https://github.com/Lolaplex/agents-keys.git@main",
]
all = [
    "klanker[browser,keys]",
]
suite = [
    "klanker[browser,keys]",
]

[project.urls]
Homepage = "https://github.com/Lolaplex/klanker"
Repository = "https://github.com/Lolaplex/klanker"
"Bug Tracker" = "https://github.com/Lolaplex/klanker/issues"

[project.scripts]
klanker = "klanker.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
