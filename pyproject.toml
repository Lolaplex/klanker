[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "clanker"
version = "0.1.0"
description = "Universal, adaptive slimemold AI agent shell on the Lolaplex suite"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lolaplex" }]
requires-python = ">=3.10"
dependencies = [
    "agents-harness @ git+https://github.com/Lolaplex/agents-harness.git@main",
    "agents-gateway @ git+https://github.com/Lolaplex/agents-gateway.git@main",
    "agents-memory @ git+https://github.com/Lolaplex/agents-memory.git@dev",
    "agents-traces @ git+https://github.com/Lolaplex/agents-traces.git@main",
    "agents-docs @ git+https://github.com/Lolaplex/agents-docs.git@main",
]

[project.optional-dependencies]
browser = [
    "agents-browser @ git+https://github.com/Lolaplex/agents-browser.git@main",
]
keys = [
    "agents-keys @ git+https://github.com/Lolaplex/agents-keys.git@main",
]
all = [
    "clanker[browser,keys]",
]
suite = [
    "clanker[browser,keys]",
]



[project.urls]
Homepage = "https://github.com/Lolaplex/clanker"
Repository = "https://github.com/Lolaplex/clanker"
"Bug Tracker" = "https://github.com/Lolaplex/clanker/issues"

[project.scripts]
clanker = "clanker.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
