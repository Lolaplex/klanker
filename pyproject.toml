[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "klanker"
version = "0.1.0"
description = "Adaptive agent distribution on the Lolaplex suite"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lolaplex" }]
requires-python = ">=3.10"
dependencies = [
    "agents-harness[mcp]>=0.1.0",
    "agents-relay>=0.1.0",
    "agents-memory>=1.2.0",
    "agents-traces>=0.1.0",
    "agents-docs>=0.0.1",
    "agents-terminal>=0.0.1",
    "agents-calendar>=0.1.0",
]

[project.optional-dependencies]
browser = [
    "agents-browser>=0.0.1",
]
keys = [
    "agents-keys>=0.0.1",
]
calendar = [
    "agents-calendar>=0.1.0",
]
all = [
    "klanker[browser,keys,calendar]",
]
suite = [
    "klanker[browser,keys,calendar]",
]

[project.urls]
Homepage = "https://github.com/Lolaplex/klanker"
Repository = "https://github.com/Lolaplex/klanker"
"Bug Tracker" = "https://github.com/Lolaplex/klanker/issues"

[project.scripts]
klanker = "klanker.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
klanker = ["modules/*.json"]
