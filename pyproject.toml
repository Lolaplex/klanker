[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "clanker"
version = "0.1.0"
description = "Universal, adaptive slimemold AI agent shell on the Lolaplex suite"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Felix Kempf" },
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
harness = [
    "agents-harness @ git+https://github.com/Lolaplex/agents-harness.git@dev",
]
gateway = [
    "agents-gateway @ git+https://github.com/Lolaplex/agents-gateway.git",
]
memory = [
    "agents-memory @ git+https://github.com/Lolaplex/agents-memory.git@dev",
]
suite = [
    "agents-harness @ git+https://github.com/Lolaplex/agents-harness.git@main",
    "agents-gateway @ git+https://github.com/Lolaplex/agents-gateway.git",
    "agents-memory @ git+https://github.com/Lolaplex/agents-memory.git@dev",
    "agents-docs @ git+https://github.com/Lolaplex/agents-docs.git",
    "agents-traces @ git+https://github.com/Lolaplex/agents-traces.git",
    "agents-browser @ git+https://github.com/Lolaplex/agents-browser.git",
]



[project.urls]
Homepage = "https://github.com/Lolaplex/clanker"
Repository = "https://github.com/Lolaplex/clanker"
"Bug Tracker" = "https://github.com/Lolaplex/clanker/issues"

[project.scripts]
clanker = "clanker.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
