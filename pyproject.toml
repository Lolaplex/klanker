[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "klanker"
version = "0.3.0"
description = "Adaptive autonomous agent runtime and terminal companion"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lolaplex" }]
requires-python = ">=3.10"
dependencies = [
    "agents-workspace>=0.2.0,<1",
    "agents-harness[mcp]>=0.2.0,<1",
    "agents-relay>=0.2.0,<1",
    "agents-memory>=1.4.0",
    "agents-sync>=0.2.0,<1",
    "agents-traces>=0.2.0,<1",
    "agents-terminal>=0.1.0",
    "agents-calendar>=0.2.0,<1",
    "agents-keys>=0.0.5",
    "agents-voice>=0.1.1",
    "agents-store>=0.0.1",
    "agents-browser>=0.47.0",
]

[project.optional-dependencies]
tui = ["pyratatui>=0.2.9"]
repl = [
    "agents-relay>=0.2.0,<1",
    "pyratatui>=0.2.9",
]
all = [
    "klanker[repl]",
]

[project.urls]
Homepage = "https://github.com/Lolaplex/klanker"
Repository = "https://github.com/Lolaplex/klanker"
"Bug Tracker" = "https://github.com/Lolaplex/klanker/issues"

[project.scripts]
klanker = "klanker.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
klanker = ["modules/*.json", "_web/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
